# LeGuard-AI Docker Compose
# Local development environment: Next.js app + PostgreSQL
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose down           # Stop and remove containers (preserves volumes)
#   docker compose down -v        # Stop and remove everything including volumes (DESTROYS DB DATA)
#   docker compose logs -f app    # View application logs
#   docker compose ps             # Check service status

name: leguard

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: leguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leguard
      POSTGRES_PASSWORD: leguard
      POSTGRES_DB: leguard
    ports:
      - "5432:5432"
    volumes:
      - leguard_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leguard -d leguard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - leguard-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m

  # ── Application ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: leguard-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://leguard:leguard@postgres:5432/leguard
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-leguard-development-only-secret-change-me-32}
      UPLOAD_DIR: .uploads
    ports:
      - "3000:3000"
    volumes:
      - leguard_uploads:/app/.uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - leguard-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m

# ── Volumes ────────────────────────────────────────────────────────────
volumes:
  leguard_postgres_data:
    driver: local
  leguard_uploads:
    driver: local

# ── Networks ───────────────────────────────────────────────────────────
networks:
  leguard-network:
    driver: bridge
